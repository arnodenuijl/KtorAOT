services:
  oracle:
    image: container-registry.oracle.com/database/free:latest
    init: true
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PWD=YourSecurePassword123!
    volumes:
#      - oracle-data:/opt/oracle/oradata
      - ./scripts:/opt/oracle/scripts/setup:ro
      - ./scripts:/opt/oracle/scripts/startup:ro
    restart: always

  webapi:
    build:
      context: .
      dockerfile: WebApi/Dockerfile
      secrets:
        - gradle_properties
    container_name: ktor-webapi
    environment:
        - ORACLE_HOST=oracle
    ports:
      - "9000:9000"
    depends_on:
      oracle:
        condition: service_healthy
    restart: always

  ldap:
    image: ghcr.io/rroemhild/docker-test-openldap:master
    container_name: ldap
    ports:
      - "10389:10389"  # LDAP
      - "10636:10636"  # LDAPS
    restart: on-failure

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-demo.json:/opt/keycloak/data/import/realm-demo.json:ro
    restart: on-failure

  kong:
    image: 'kong:3.9-ubuntu'  # Main Kong Gateway Control Plane (default to latest version)
    container_name: kong
    restart: on-failure
    depends_on:
      - ldap
      - keycloak
    environment:
      KONG_DATABASE: off  # Admin API on HTTP + HTTPS
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl  # Admin API on HTTP + HTTPS
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl  # Admin API on HTTP + HTTPS
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002, 0.0.0.0:8445 ssl  # Kong Manager on HTTP + HTTPS
      KONG_ADMIN_GUI_URL: http://localhost:8002  # URL for GUI links
      KONG_DECLARATIVE_CONFIG: /opt/kong/kong.yml  # Path to the declarative configuration file
      KONG_PASSWORD: handyshake  # Required for logging in to Kong Manager (RBAC)
      KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES: cjson.safe
    ports:
      - "8000:8000"  # Proxy HTTP
      - "8443:8443"  # Proxy HTTPS
      - "8001:8001"  # Admin API HTTP
      - "8444:8444"  # Admin API HTTPS
      - "8002:8002"  # Kong Manager HTTP
      - "8445:8445"  # Kong Manager HTTPS
    volumes:
      - ./kong.yml:/opt/kong/kong.yml  # Mount the declarative configuration file into the container

volumes:
  oracle-data:

secrets:
  gradle_properties:
    file: ${GRADLE_PROPERTIES_FILE:?Set GRADLE_PROPERTIES_FILE to the absolute path of your user-level gradle.properties}