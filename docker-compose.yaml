services:
  webapi:
    build:
      context: .
      dockerfile: WebApi/Dockerfile
    container_name: ktor-webapi
    environment:
        - ORACLE_HOST=oracle
    ports:
      - "9000:9000"
    depends_on:
      oracle:
        condition: service_healthy
    restart: no

  oracle:
    image: container-registry.oracle.com/database/free:latest
    init: true
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PWD=YourSecurePassword123!
    volumes:
      - ./scripts:/opt/oracle/scripts/setup:ro
      - ./scripts:/opt/oracle/scripts/startup:ro
    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: always
