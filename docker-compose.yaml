services:
  webapi:
    build:
      context: .
      dockerfile: WebApi/Dockerfile
      secrets:
        - gradle_properties
    container_name: ktor-webapi
    environment:
        - ORACLE_HOST=oracle
    ports:
      - "9000:9000"
    depends_on:
      oracle:
        condition: service_healthy
    restart: no

  oracle:
    image: container-registry.oracle.com/database/free:latest
    init: true
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PWD=YourSecurePassword123!
    volumes:
      - ./scripts:/opt/oracle/scripts/setup:ro
      - ./scripts:/opt/oracle/scripts/startup:ro
    restart: always


secrets:
  gradle_properties:
    file: ${GRADLE_PROPERTIES_FILE:?Set GRADLE_PROPERTIES_FILE to the absolute path of your user-level gradle.properties}