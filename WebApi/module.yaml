product: jvm/app

settings:
  kotlin:
    version: 2.4.20
    serialization: enabled
    # Equivalent of the Gradle `ktor { openApi { ... } }` block
    compilerPlugins:
      - id: io.ktor.ktor-compiler-plugin
        dependency: io.ktor:ktor-compiler-plugin:3.6.0
        options:
          openApiEnabled: "true"
          openApiCodeInference: "true"
          openApiOnlyCommented: "false"
  jvm:
    jdk:
      version: 25
    mainClass: ApplicationKt
  ktor:
    enabled: true

dependencies:
  - ../Persistence
  - ../Domain
  - $libs.exposed.core
  - $libs.exposed.json
  - $libs.exposed.jdbc
  - $libs.oracle.jdbc
  - $libs.kotlin.reflect
  - $libs.ktor.server.core
  - $libs.ktor.server.cio
  - $libs.ktor.server.forwarded.header
  - $libs.ktor.server.content.negotiation
  - $libs.ktor.server.routing.openapi
  - $libs.ktor.server.routing.swagger
  - $libs.ktor.serialization.kotlinx.json
  - $libs.logback.classic

test-dependencies:
  - $libs.pact.provider.junit5
  - $libs.groovy
  - $libs.groovy.json
  - $libs.groovy.xml

