
[versions]
ktor-version = "3.6.0"
kotlin-version = "2.4.20"
logback-version = "1.6.3"
graalvm-version = "25.3.4.1"
graalvm-buildtool-version = "1.1.13"
com-google-devtools-ksp-version = "2.3.12"
symbol-processing-api-version = "1.5.30-1.0.0"
kotlin-poet-version = "2.4.0"
exposed-version = "1.5.0"
oracle-jdbc-version = "23.26.3.0.0"
kotlinx-serialization-json-version = "1.11.0"
openrewrite = "8.92.9"
openrewrite-pugin = "7.41.0"
junit = "6.1.3"

[libraries]
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin-version" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json-version" }
ktor-server-core = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor-version" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio-jvm", version.ref = "ktor-version" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor-version" }
ktor-server-routing-openapi = { module = "io.ktor:ktor-server-routing-openapi", version.ref = "ktor-version" }
ktor-server-routing-swagger = { module = "io.ktor:ktor-server-swagger", version.ref = "ktor-version" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor-version" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback-version" }
graalvm-sdk-nativeimage = { module = "org.graalvm.sdk:nativeimage", version.ref = "graalvm-version" }
ksp-symbol-processing-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "symbol-processing-api-version" }
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlin-poet-version" }
kotlinpoet-ksp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "kotlin-poet-version" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed-version" }
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed-version" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed-version" }
oracle-jdbc = { module = "com.oracle.database.jdbc:ojdbc17", version.ref = "oracle-jdbc-version" }

openrewrite-java = { module = "org.openrewrite:rewrite-java", version.ref = "openrewrite" }
openrewrite-kotlin = { module = "org.openrewrite:rewrite-kotlin", version.ref = "openrewrite" }
openrewrite-recipes-kotlin = { module = "io.moderne.recipe:recipes-kotlin", version.ref = "openrewrite" }
openrewrite-gradle = { module = "org.openrewrite:rewrite-gradle", version.ref = "openrewrite" }
openrewrite-yaml = { module = "org.openrewrite:rewrite-yaml", version.ref = "openrewrite" }
openrewrite-properties = { module = "org.openrewrite:rewrite-properties", version.ref = "openrewrite" }

openrewrite-test = { module = "org.openrewrite:rewrite-test", version.ref = "openrewrite" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }

[bundles]
# Combine core engine and language specs needed for writing recipes
openrewrite-recipe-authoring = [
    "openrewrite-java",
    "openrewrite-kotlin",
    "openrewrite-gradle",
    "openrewrite-yaml",
    "openrewrite-properties"
]

# Combine rewrite-test harness and JUnit 5
openrewrite-testing = [
    "openrewrite-test",
    "junit-jupiter-api"
]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin-version" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor-version" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin-version" }
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvm-buildtool-version" }
ksp = { id = "com.google.devtools.ksp", version.ref = "com-google-devtools-ksp-version" }
open-rewrite = { id = "org.openrewrite.rewrite", version.ref = "openrewrite-pugin" }