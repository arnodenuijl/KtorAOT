product: jvm/app

settings:
  kotlin:
    version: 2.4.20
    serialization: enabled
    # Equivalent of the Gradle `ktor { openApi { ... } }` block
  jvm:
    jdk:
      version: 25
    mainClass: ApplicationKt
  ktor:
    enabled: false

dependencies:
  - $libs.ktor.client.core
  - $libs.ktor.client.cio
  - $libs.ktor.serialization.kotlinx.json
  - $libs.logback.classic
  - $libs.logback.classic

test-dependencies:
  - $libs.ktor.client.mock
  - $libs.pact.consumer.junit5

